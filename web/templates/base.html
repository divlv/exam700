<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c6b4f">
  <title>{% block title %}AZ-700 — тренажёр экзамена{% endblock %}</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="topbar-brand" href="/">AZ-700</a>
    {% if logged_in|default(true) %}
    <form method="post" action="/logout" class="topbar-logout">
      <button type="submit" class="btn-link">Выход</button>
    </form>
    {% endif %}
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
